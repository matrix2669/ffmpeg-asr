name: Validate

on:
  push:
    branches:
      - main
      - dev
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate shell and release metadata
        run: ./scripts/validate.sh
